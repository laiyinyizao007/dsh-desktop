# TCP tuning for the tunnel to Cloudflare.
#
# The default congestion control is cubic, which treats a reordered packet
# as congestion and collapses the window — on a link that reorders, that is
# a few segments and a few tens of kilobytes a second. BBR sends at the
# bandwidth-delay product and does not mistake reordering for loss.
#
# The socket buffers are the real ceiling: BDP has nowhere to go while
# net.core.rmem_max and wmem_max are still at their default of 208 KB.
#
# slow_start_after_idle would otherwise make the tunnel crawl again after
# every quiet minute, and mtu_probing covers a path whose MTU changes.
#
# Roll back with: sysctl -w net.ipv4.tcp_congestion_control=cubic
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
